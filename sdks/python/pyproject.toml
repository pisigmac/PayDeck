[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paydeck"
version = "1.0.0"
description = "Official Python SDK for PayDeck billing microservice"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "PiSigma / PayDeck Team", email = "dev@pisigma.org" }
]
keywords = ["paydeck", "billing", "razorpay", "stripe", "payments", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/pisigmac/PayDeck"
Repository = "https://github.com/pisigmac/PayDeck.git"
